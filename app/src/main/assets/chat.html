<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Connector</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
:root{--bg:#fafafa;--tx:#0a0a0a;--mu:#71717a;--gl:rgba(255,255,255,.66);--dg:rgba(255,255,255,.96);--bd:rgba(0,0,0,.09);--hv:rgba(0,0,0,.06);--ink:#0a0a0a;--on:#fff;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#09090b;--tx:#fafafa;--mu:#a1a1aa;--gl:rgba(30,30,34,.52);--dg:rgba(28,28,32,.95);--bd:rgba(255,255,255,.1);--hv:rgba(255,255,255,.08);--ink:#fafafa;--on:#09090b;color-scheme:dark}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{display:flex;color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);background:var(--bg);opacity:0;transform:translateY(8px);animation:bootIn .45s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes bootIn{to{opacity:1;transform:none}}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.gl,dialog{background:var(--gl);-webkit-backdrop-filter:blur(24px) saturate(1.5);backdrop-filter:blur(24px) saturate(1.5);border:1px solid var(--bd)}
#side{width:300px;flex:none;display:flex;flex-direction:column;padding:18px 14px 14px;border-width:0 1px 0 0;border-radius:0 30px 30px 0;background:var(--dg);z-index:30}
.logo{font:700 28px system-ui;letter-spacing:-.03em}
#list{overflow:auto;flex:1;margin-top:10px}
.ci{display:flex;align-items:center;border-radius:14px;padding:12px;cursor:pointer;gap:6px}
.ci span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:16px}
.sh{display:flex;align-items:center;justify-content:space-between;padding:0 4px 16px 10px}
.rd{width:44px;height:44px;border-radius:50%;border:1px solid var(--bd);background:var(--hv);display:grid;place-items:center}
#q{width:100%;padding:10px 14px;margin:0 0 8px;border:1px solid var(--bd);border-radius:99px;background:var(--hv);color:inherit;font:16px system-ui;outline:0}
.nv{display:flex;align-items:center;gap:16px;width:100%;padding:12px 10px;border-radius:14px;font-size:17px;font-weight:500;text-align:left}
.nv:hover,.nv.on{background:var(--hv)}
hr{border:0;height:1px;background:var(--bd);margin:10px 8px}
#new{width:54px;height:54px;border-radius:50%;background:var(--ink);color:var(--on);display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.22);flex:none;margin-top:10px}
.pt{font:700 28px/1.2 system-ui;letter-spacing:-.03em;margin:12px 0 6px}
.card{padding:14px 16px;border-radius:18px;margin:10px 0;cursor:pointer}
.card b{display:block}.card small,.muted{color:var(--mu);font-size:14px}
.pl{padding:9px 16px;border-radius:99px;border:1px solid var(--bd);font-weight:600;font-size:14px}
.pl:hover{background:var(--hv)}.pl.p{background:var(--ink);color:var(--on);border-color:transparent}
@media(min-width:761px){#menu{display:none}}
.tabs{display:flex;gap:6px;margin:8px 0 10px}.tab{flex:1;padding:9px;border-radius:99px;font-weight:600;font-size:14px;color:var(--mu)}.tab.on{background:var(--hv);color:var(--tx)}
.vh{position:absolute;top:0;left:0;width:1px;height:1px;opacity:0;overflow:hidden}
main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
#msgs{flex:1;overflow:auto;padding:8px 16px 16px;min-height:0}
header{display:flex;align-items:center;gap:8px;padding:8px 12px}
#ttl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mu);font-size:14px}
.ib{width:38px;height:38px;border-radius:12px;font-size:19px;display:grid;place-items:center;flex:none}
.ib:hover{background:var(--hv)}
.chip{font-size:13px;color:var(--mu);padding:6px 12px;border-radius:99px;border:1px solid var(--bd);max-width:44vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#inner{max-width:760px;margin:0 auto}
.hello{text-align:center;margin-top:min(18vh,120px);font:600 34px/1.15 system-ui;letter-spacing:-.03em}
.hello small{display:block;font:400 15px system-ui;color:var(--mu);margin-top:12px}
.m{margin:20px 0}.m.u{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.bub{background:var(--hv);border:1px solid var(--bd);padding:10px 15px;border-radius:20px 20px 6px 20px;max-width:88%;white-space:pre-wrap;overflow-wrap:anywhere}
.cf{font-size:12px;color:var(--mu);border:1px solid var(--bd);border-radius:99px;padding:2px 10px;background:var(--hv)}
.md{overflow-wrap:anywhere;line-height:1.7}.md p{margin:.6em 0}.md pre{background:var(--hv);border:1px solid var(--bd);border-radius:14px;overflow:hidden;margin:.8em 0;padding:0}.md pre code{display:block;padding:12px 14px;overflow-x:auto;background:none}
.cb{display:flex;align-items:center;gap:4px;padding:4px 6px 4px 14px;font:12px system-ui;color:var(--mu);border-bottom:1px solid var(--bd)}.cb span{flex:1}
.sb{font:13px system-ui;color:var(--mu);padding:4px 10px;border-radius:99px}.sb:hover{background:var(--hv);color:var(--tx)}
.acts{display:flex;flex-wrap:wrap;gap:2px;margin-top:2px}
.thinking{display:inline-flex;align-items:center;gap:10px;padding:4px 2px;color:var(--mu);font-size:14.5px}
.thinking .dots{display:inline-flex;gap:5px}.thinking .dots i{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.3;animation:think-bounce 1.2s infinite}.thinking .dots i:nth-child(2){animation-delay:.15s}.thinking .dots i:nth-child(3){animation-delay:.3s}
@keyframes think-bounce{0%,80%,100%{transform:translateY(0);opacity:.25}40%{transform:translateY(-6px);opacity:1}}
#comp{max-width:760px;width:calc(100% - 24px);margin:0 auto;border-radius:26px;padding:10px 10px 6px;box-shadow:0 8px 32px rgba(0,0,0,.08);flex:none;margin-bottom:max(12px,env(safe-area-inset-bottom,0px))}
#in{width:100%;border:0;outline:0;resize:none;background:none;color:inherit;font:18px/1.5 system-ui;padding:4px 8px;max-height:200px}
#atts{display:flex;flex-wrap:wrap;gap:6px;padding:0 6px}.row{display:flex;align-items:center;gap:2px}
#go{margin-left:4px;width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--on);display:grid;place-items:center}
dialog{color:var(--tx);background:var(--dg);border-radius:22px;padding:20px;width:min(520px,94vw);max-height:calc(100dvh - 32px);overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.3)}
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px}
dialog input:not([type=checkbox]),dialog select,dialog textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--hv);color:inherit;font:15px system-ui;outline:0}
.btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:16px}
.pri{background:var(--ink);color:var(--on);padding:9px 18px;border-radius:99px;font-weight:600}
#art{width:min(900px,96vw);height:86vh;padding:0;overflow:hidden}#art[open]{display:flex;flex-direction:column}.ah{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-bottom:1px solid var(--bd)}#art iframe{flex:1;border:0;background:#fff;width:100%}
#scrim{display:none}
@media(max-width:760px){#side{position:fixed;inset:0 auto 0 0;transform:translateX(-100%);transition:transform .2s;width:min(320px,84vw)}#side.open{transform:none}#scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20}}
.conn-list{display:flex;flex-direction:column;gap:12px;margin-top:4px;padding-bottom:24px}
.conn-card{display:flex;flex-direction:column;gap:12px;padding:16px;border:1px solid var(--bd);border-radius:18px;background:var(--dg)}
.conn-top{display:flex;align-items:flex-start;gap:12px}
.conn-icon{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--hv);border:1px solid var(--bd);flex:none}.conn-icon svg{width:22px;height:22px}
.conn-body{flex:1;min-width:0}.conn-name{font-weight:600;font-size:15.5px}.conn-status{font-size:13px;color:var(--mu);margin-top:3px}.conn-status.on{color:#16a34a}
.conn-actions{display:flex;flex-wrap:wrap;gap:8px}.conn-badge{font-size:11px;font-weight:600;padding:4px 9px;border-radius:99px;background:rgba(22,163,74,.12);color:#16a34a}.conn-badge.off{background:var(--hv);color:var(--mu);border:1px solid var(--bd)}
.conn-sec{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--mu);margin:18px 0 6px}
.viz-frame{width:100%;border:1px solid var(--bd);border-radius:16px;overflow:hidden;margin:10px 0;background:#fff}.viz-frame iframe{width:100%;border:0;display:block;min-height:280px}.viz-bar{display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--bd);background:var(--hv);font-size:12.5px;color:var(--mu)}
</style>
</head>
<body>
<div id="scrim"></div>
<aside id="side" class="gl">
  <div class="sh"><div class="logo">Connector</div><button class="rd" id="sb" aria-label="Поиск">⌕</button></div>
  <input id="q" placeholder="Поиск по чатам" hidden>
  <div id="nav">
    <button class="nv" id="nP"><span>Проекты</span></button>
    <button class="nv" id="nC"><span>Коннекторы</span></button>
    <button class="nv" id="nL"><span>Библиотека</span></button>
    <hr>
  </div>
  <div id="pm" hidden></div>
  <div id="list"></div>
  <button id="new" aria-label="Новый чат">+</button>
</aside>
<main>
  <header>
    <button class="ib" id="menu" aria-label="Меню">☰</button>
    <span id="ttl"></span>
    <button class="chip" id="mod"></button>
  </header>
  <div id="msgs"><div id="inner"></div></div>
  <div id="comp" class="gl">
    <div id="atts"></div>
    <textarea id="in" rows="1" placeholder="Задайте любой вопрос"></textarea>
    <div class="row">
      <button class="ib" id="att" aria-label="Прикрепить файл">+</button>
      <button class="ib" id="web" aria-label="Веб-поиск" style="display:none">🌐</button>
      <span style="flex:1"></span>
      <button id="go" aria-label="Отправить"></button>
    </div>
  </div>
</main>
<input type="file" id="file" multiple class="vh" accept="*/*">
<input type="file" id="fileQ" multiple class="vh" accept="*/*">
<dialog id="set">
  <b style="font:700 20px system-ui">Настройки</b>
  <label>Провайдер</label><select id="sP"></select>
  <label>API-ключ</label><input id="sK" type="password" autocomplete="off">
  <label>Модель</label><input id="sM">
  <label>Адрес API (необязательно)</label><input id="sU">
  <label>Инструкции</label><textarea id="sS" rows="3"></textarea>
  <div class="btns"><button class="sb" id="clr">Очистить чаты</button><button class="sb" id="sX">Закрыть</button><button class="pri" id="sV">Сохранить</button></div>
</dialog>
<dialog id="pf">
  <b id="pT">Проект</b>
  <label>Название</label><input id="pN">
  <label>Инструкции</label><textarea id="pS" rows="3"></textarea>
  <label>Файлы</label><div id="pfl"></div><input type="file" id="fileP" multiple class="vh">
  <div class="btns"><button class="sb" id="pD">Удалить</button><button class="sb" id="pA">Файлы</button><button class="sb" id="pX">Отмена</button><button class="pri" id="pV">Сохранить</button></div>
</dialog>
<dialog id="ghAuth">
  <b>GitHub</b>
  <p class="muted">Personal Access Token (repo, read:user)</p>
  <label>Token</label><input id="ghToken" type="password">
  <p id="ghAuthErr" style="color:#dc2626;display:none"></p>
  <div class="btns"><button class="sb" id="ghAuthX">Отмена</button><button class="pri" id="ghAuthV">Подключить</button></div>
</dialog>
<dialog id="mcpAuth">
  <b id="mcpAuthTitle">Свой MCP</b>
  <label>Название</label><input id="mcpName">
  <label>URL</label><input id="mcpUrl">
  <label>Token</label><input id="mcpToken" type="password">
  <p id="mcpAuthErr" style="color:#dc2626;display:none"></p>
  <div class="btns"><button class="sb" id="mcpAuthX">Отмена</button><button class="pri" id="mcpAuthV">Сохранить</button></div>
</dialog>
<dialog id="cm"><div id="cmb"></div></dialog>
<dialog id="art"><div class="ah"><b>Артефакт</b><button class="ib" id="aX">✕</button></div><iframe sandbox="allow-scripts"></iframe></dialog>
<script>
const $=s=>document.querySelector(s);
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const mk=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null&&x!=='')e.textContent=x;return e};
const btn=(l,f)=>{const b=mk('button','sb',l);b.onclick=f;return b};
const pill=(l,f,p)=>{const b=mk('button','pl'+(p?' p':''),l);b.onclick=f;return b};
const ico=a=>a&&a.k==='img'?'🖼️ ':a&&a.k==='pdf'?'📄 ':'📎 ';
const P={anthropic:{n:'Anthropic (Claude)',u:'https://api.anthropic.com',m:'claude-sonnet-5-5'},openai:{n:'OpenAI',u:'https://api.openai.com/v1',m:'gpt-4o'},openrouter:{n:'OpenRouter',u:'https://openrouter.ai/api/v1',m:'anthropic/claude-sonnet-4.5'},gemini:{n:'Google Gemini',u:'https://generativelanguage.googleapis.com/v1beta/openai',m:'gemini-2.5-flash'},deepseek:{n:'DeepSeek',u:'https://api.deepseek.com',m:'deepseek-chat'},custom:{n:'Другой (OpenAI-совместимый)',u:'',m:''}};
const DRAW='Когда нужна картинка/схема — SVG в ```svg. Когда график/дашборд/интерактив — HTML в ```html (можно Chart.js с CDN https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js). После блока одно короткое пояснение.';
const WEB_TOOL='Если нужны свежие данные из интернета, используй:\n<web_search>\nquery: ...\n</web_search>\nили\n<web_fetch>\nurl: https://...\n</web_fetch>\nНе выдумывай результаты.';
let S={prov:'anthropic',key:'',url:'',proxy:'',model:'claude-sonnet-5-5',sys:'',...LS('cfg',{})};
const isNative=!!(window.AndroidBridge);
window.__nativePending={};
window.__nativeHttpDone=function(id,status,body){const p=window.__nativePending[id];if(!p)return;delete window.__nativePending[id];p.resolve({status,body,ok:status>=200&&status<300});};
window.__nativeHttpError=function(id,msg){const p=window.__nativePending[id];if(!p)return;delete window.__nativePending[id];p.reject(new Error(msg||'Network error'));};
window.__nativeStreamChunk=function(id,data){const p=window.__nativePending[id];if(p&&p.onChunk)p.onChunk(data);};
window.__nativeStreamDone=function(id){const p=window.__nativePending[id];if(!p)return;delete window.__nativePending[id];if(p.onDone)p.onDone();if(p.resolve)p.resolve();};
window.__nativeStreamError=function(id,msg){const p=window.__nativePending[id];if(!p)return;delete window.__nativePending[id];if(p.reject)p.reject(new Error(msg||'Stream error'));};
window.__nativeFilesPicked=function(id,json){const p=window.__nativePending[id];if(!p)return;delete window.__nativePending[id];if(p.resolve)p.resolve(json);};
function nativeId(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}
function nativeHttpPost(url,headers,body){return new Promise((resolve,reject)=>{const id=nativeId();window.__nativePending[id]={resolve,reject};AndroidBridge.httpPost(id,url,JSON.stringify(headers),typeof body==='string'?body:JSON.stringify(body));});}
function nativeHttpGet(url){return new Promise((resolve,reject)=>{const id=nativeId();window.__nativePending[id]={resolve,reject};AndroidBridge.httpGet(id,url);});}
function nativeStream(url,headers,body,onChunk){return new Promise((resolve,reject)=>{const id=nativeId();window.__nativePending[id]={onChunk,onDone:resolve,resolve,reject};AndroidBridge.streamPost(id,url,JSON.stringify(headers),typeof body==='string'?body:JSON.stringify(body));});}
function nativePickFiles(){return new Promise((resolve,reject)=>{if(!window.AndroidBridge||!AndroidBridge.pickFiles){reject(new Error('no-picker'));return;}const id=nativeId();window.__nativePending[id]={resolve:(payload)=>{try{const arr=typeof payload==='string'?JSON.parse(payload):payload;resolve(arr||[]);}catch(e){resolve([]);}},reject};AndroidBridge.pickFiles(id);});}
let CX=LS('connectors',{github:{enabled:true,token:'',user:null},custom:[]});if(!CX.github)CX.github={enabled:true,token:'',user:null};if(!Array.isArray(CX.custom))CX.custom=[];
const saveCX=()=>save('connectors',CX);
let mcpEditId=null,tab='chat',cur=null,chats=LS('chats',[]),PR=[],att=[],run=false,stop=false,rd=null,stat='',toolLoops=0,np=null,fp=null,pv=null,pt='chats',sideAll=false,qs='',raf=0,ep={};
const idb=()=>new Promise((ok,err)=>{const r=indexedDB.open('connector',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>err(r.error);});
const kvGet=async k=>{try{const d=await idb();return await new Promise(ok=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>ok()})}catch{}};
const kvSet=async(k,v)=>{try{const d=await idb();d.transaction('kv','readwrite').objectStore('kv').put(v,k)}catch{}};
kvGet('pr').then(v=>{PR=v||[];list();render()});
const prj=id=>PR.find(p=>p.id==id);
function persist(){save('chats',chats.map(c=>({...c,msgs:c.msgs.map(m=>({...m,a:(m.a||[]).map(a=>a.k=='txt'?a:{k:a.k,n:a.n,d:''})}))})));}
const readF=f=>new Promise(res=>{if(!f)return res(null);if(f.size>20e6){alert((f.name||'file')+': файл больше 20 МБ');return res(null)}const name=(f.name||'file').toLowerCase();const r=new FileReader();const i=(f.type||'').startsWith('image/')||/\.(png|jpe?g|gif|webp|bmp)$/i.test(name);const p=(f.type==='application/pdf')||/\.pdf$/i.test(name);r.onload=()=>{try{if(i||p){const dataUrl=String(r.result||'');const b64=dataUrl.includes(',')?dataUrl.split(',')[1]:dataUrl;res({k:p?'pdf':'img',n:f.name||(p?'file.pdf':'image.png'),mt:f.type||(p?'application/pdf':'image/png'),d:b64});}else{res({k:'txt',n:f.name||'file.txt',d:String(r.result||'')});}}catch(e){res(null)}};r.onerror=()=>res(null);if(i||p)r.readAsDataURL(f);else r.readAsText(f);});
async function addFiles(fs,arr,done){for(const f of fs){const a=await readF(f);if(a)arr.push(a)}done()}
function renderAtt(){const b=$('#atts');b.textContent='';att.forEach((a,i)=>{const c=mk('span','cf',ico(a)+a.n+'  ✕');c.onclick=()=>{att.splice(i,1);renderAtt()};b.append(c)});}
async function pickAndAttach(){if(isNative&&window.AndroidBridge&&AndroidBridge.pickFiles){try{const files=await nativePickFiles();(files||[]).forEach(a=>{if(!a||!a.d)return;const name=(a.n||'').toLowerCase();const isImg=(a.mt||'').startsWith('image/')||/\.(png|jpe?g|gif|webp|bmp)$/i.test(name);const isPdf=a.mt==='application/pdf'||/\.pdf$/i.test(name);att.push({k:isPdf?'pdf':(isImg?'img':'txt'),n:a.n||'file',mt:a.mt||'',d:a.d});});renderAtt();return;}catch(e){console.warn(e);}}const el=$('#file');if(el)el.click();}
$('#att').onclick=()=>{pickAndAttach()};
$('#file').onchange=e=>{const fs=[...(e.target.files||[])];if(fs.length)addFiles(fs,att,()=>renderAtt());e.target.value='';};
function openSet(){$('#sP').innerHTML=Object.entries(P).map(([k,v])=>'<option value="'+k+'">'+v.n+'</option>').join('');$('#sP').value=S.prov;$('#sK').value=S.key;$('#sM').value=S.model;$('#sU').value=S.url||'';$('#sS').value=S.sys||'';$('#set').showModal();}
$('#sP').onchange=e=>{$('#sM').value=P[e.target.value].m;$('#sU').value='';};
$('#sV').onclick=()=>{S={prov:$('#sP').value,key:$('#sK').value.trim(),model:$('#sM').value.trim(),url:$('#sU').value.trim(),proxy:'',sys:$('#sS').value};save('cfg',S);$('#set').close();render();};
$('#sX').onclick=()=>$('#set').close();
$('#clr').onclick=()=>{if(confirm('Удалить все чаты?')){chats=[];cur=null;persist();list();render()}};
$('#mod').onclick=openSet;
const closeSide=()=>{$('#side').classList.remove('open');$('#scrim').classList.remove('open')};
$('#menu').onclick=()=>{sideAll=false;list();$('#side').classList.toggle('open');$('#scrim').classList.toggle('open')};
$('#scrim').onclick=closeSide;
$('#new').onclick=()=>{if(run)return;cur=null;np=fp;tab='chat';sideAll=false;list();render();closeSide();$('#in').focus()};
$('#nC').onclick=()=>{tab='connectors';list();render();closeSide()};
$('#nL').onclick=()=>{tab='library';list();render();closeSide()};
$('#nP').onclick=()=>{if(run)return;tab='projects';pv=null;list();render();closeSide()};
$('#ghAuthX').onclick=()=>$('#ghAuth').close();$('#ghAuthV').onclick=()=>connectGitHub();
$('#mcpAuthX').onclick=()=>$('#mcpAuth').close();$('#mcpAuthV').onclick=()=>saveMcpConnector();
const TRI='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5"/></svg>';
const SQ='<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>';
const busy=on=>{$('#go').innerHTML=on?SQ:TRI};
function fit(){const t=$('#in');t.style.height='auto';t.style.height=Math.min(t.scrollHeight,200)+'px'}
$('#in').oninput=fit;
$('#in').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!matchMedia('(pointer:coarse)').matches){e.preventDefault();send()}};
$('#go').onclick=send;
function md(t){try{return DOMPurify.sanitize(marked.parse(t||''))}catch{return (t||'').replace(/</g,'&lt;')}}
function lines(tx){return String(tx).split('\n').map(l=>l.replace(/^data:\s?/,'').trim()).filter(l=>l&&l!=='[DONE]').map(l=>{try{return JSON.parse(l)}catch{return null}}).filter(Boolean)}
async function* sse(res){const reader=res.body.getReader();const dec=new TextDecoder();let buf='';while(true){const {value,done}=await reader.read();if(done)break;buf+=dec.decode(value,{stream:true});const parts=buf.split('\n\n');buf=parts.pop()||'';for(const p of parts){for(const line of p.split('\n')){if(line.startsWith('data:')){const d=line.slice(5).trim();if(d==='[DONE]')return;try{yield JSON.parse(d)}catch{}}}}}}
function toM(m,an){const parts=[];if(m.t)parts.push(an?{type:'text',text:m.t}:{type:'text',text:m.t});(m.a||[]).forEach(a=>{if(a.k==='img'&&a.d){if(an)parts.push({type:'image',source:{type:'base64',media_type:a.mt||'image/png',data:a.d}});else parts.push({type:'image_url',image_url:{url:'data:'+(a.mt||'image/png')+';base64,'+a.d}});}});if(!parts.length)parts.push({type:'text',text:''});return {role:m.r==='user'?'user':'assistant',content:an?parts:(parts.length===1&&parts[0].type==='text'?parts[0].text:parts)};}
function blk(a,an){if(a.k==='txt'&&a.d)return an?{type:'text',text:'[file '+a.n+']\n'+a.d}:{type:'text',text:'[file '+a.n+']\n'+a.d};if(a.k==='img'&&a.d)return an?{type:'image',source:{type:'base64',media_type:a.mt||'image/png',data:a.d}}:null;return null;}
function parseToolCall(text){if(!text)return null;const search=text.match(/<web_search>[\s\S]*?query:\s*([\s\S]*?)<\/web_search>/i);if(search)return{type:'search',q:search[1].trim()};const fetchm=text.match(/<web_fetch>[\s\S]*?url:\s*([\s\S]*?)<\/web_fetch>/i);if(fetchm)return{type:'fetch',url:fetchm[1].trim()};return null;}
async function ddgSearch(q){try{const url='https://api.duckduckgo.com/?q='+encodeURIComponent(q)+'&format=json&no_html=1&skip_disambig=1';let data;if(isNative){const r=await nativeHttpGet(url);data=JSON.parse(r.body||'{}');}else{const r=await fetch(url);data=await r.json();}const out=[];if(data.AbstractText)out.push(data.AbstractText);(data.RelatedTopics||[]).slice(0,5).forEach(t=>{if(t.Text)out.push('• '+t.Text);});return out.join('\n')||'Ничего не найдено по запросу «'+q+'».';}catch(e){return 'Ошибка поиска: '+e.message;}}
async function fetchPage(url){try{let body;if(isNative){const r=await nativeHttpGet(url);body=r.body||'';}else{const r=await fetch(url);body=await r.text();}return body.replace(/<script[\s\S]*?<\/script>/gi,' ').replace(/<style[\s\S]*?<\/style>/gi,' ').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim().slice(0,8000);}catch(e){return 'Не удалось прочитать '+url+': '+e.message;}}
async function gen(){const am={r:'assistant',t:''};cur.msgs.push(am);run=true;stop=false;rd=null;busy(1);render();const an=S.prov=='anthropic';const hist=cur.msgs.slice(0,-1).filter(m=>m.r=='user'||(m.t&&!m.err));const ms=hist.map(m=>toM(m,an)),first=ms.find(m=>m.role=='user');const pj=prj(cur.pid),pf=(pj?pj.files:[]).filter(a=>a.d).map(a=>blk(a,an)).filter(Boolean);if(first&&pf.length)first.content.unshift(...pf);const sys=[S.sys.trim(),pj&&pj.sys.trim(),DRAW,WEB_TOOL].filter(Boolean).join('\n\n');
try{if(location.protocol==='file:'&&!isNative)throw new Error('Откройте через HTTP сервер или Android-приложение.');let target=an?(S.url||P.anthropic.u).replace(/\/$/,'')+'/v1/messages':(S.url||(P[S.prov]||{}).u||'').replace(/\/$/,'')+'/chat/completions';let url=target;const hd=an?{'content-type':'application/json','x-api-key':S.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'}:{'content-type':'application/json','authorization':'Bearer '+S.key};const body=an?{model:S.model,max_tokens:8192,stream:true,system:sys,messages:ms}:{model:S.model,stream:true,messages:[{role:'system',content:sys},...ms]};const pick=j=>an?(j.type=='content_block_delta'&&j.delta&&j.delta.text?j.delta.text:''):(j.choices&&j.choices[0]&&j.choices[0].delta&&j.choices[0].delta.content||'');const pickFull=j=>an?(j.content||[]).map(x=>x.text||'').join(''):(j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content||'');
if(isNative){try{await nativeStream(url,hd,Object.assign({},body,{stream:true}),(data)=>{if(stop||data==='[DONE]')return;try{const j=JSON.parse(data);const d=pick(j);if(d){am.t+=d;paint();}}catch(_){}});}catch(streamErr){if(stop)throw streamErr;const res=await nativeHttpPost(url,hd,Object.assign({},body,{stream:false}));if(!res.ok)throw new Error(res.status+' '+String(res.body).slice(0,400));let j=null;try{j=JSON.parse(res.body);}catch(_){}am.t=j?pickFull(j):(res.body||'');paint();}}else{const go=st=>fetch(url,{method:'POST',headers:hd,body:JSON.stringify(Object.assign({},body,{stream:st}))});let res,ns=false;try{res=await go(true)}catch(e){res=await go(false);ns=true}if(!res.ok)throw new Error(res.status+' '+(await res.text()).slice(0,400));if(ns){const tx=await res.text();let j=null;try{j=JSON.parse(tx)}catch{}am.t=j?pickFull(j):tx;paint();}else{for await(const j of sse(res)){if(stop)break;const d=pick(j);if(d){am.t+=d;paint();}}}}
if(!stop&&am.t&&!am.err&&toolLoops<4){const call=parseToolCall(am.t);if(call){toolLoops++;stat=call.type==='search'?'Ищу…':'Читаю…';render();let resultText='';try{resultText=call.type==='search'?await ddgSearch(call.q):await fetchPage(call.url);}catch(e){resultText='Ошибка: '+e.message;}stat='';cur.msgs.push({r:'user',t:'[Результат инструмента]\n'+resultText,a:[]});persist();return gen();}}
toolLoops=0;}catch(e){if(!stop){am.t+=(am.t?'\n\n':'')+'Ошибка: '+e.message;am.err=1;}}
if(!am.t)cur.msgs.pop();run=false;rd=null;busy(0);persist();render();list();}
async function send(){if(run){stop=true;return}const t=$('#in').value.trim();if(!t&&!att.length)return;if(!S.key){openSet();return}if(!cur){cur={id:Date.now(),title:(t||att[0].n).slice(0,48),msgs:[],pid:np};chats.unshift(cur)}cur.msgs.push({r:'user',t,a:att});att=[];$('#in').value='';fit();renderAtt();list();gen();}
function paint(){if(raf)return;raf=requestAnimationFrame(()=>{raf=0;const box=$('#inner'),s=$('#msgs');const near=s.scrollHeight-s.scrollTop-s.clientHeight<140;if(box.lastElementChild)box.lastElementChild.replaceWith(node(cur.msgs[cur.msgs.length-1],cur.msgs.length-1));if(near)s.scrollTop=s.scrollHeight;});}
function enh(root){root.querySelectorAll('pre').forEach(p=>{const codeEl=p.querySelector('code');if(!codeEl||p.dataset.done)return;p.dataset.done=1;const cls=codeEl.className||'';const lang=(cls.match(/language-([\w-]+)/)||[])[1]||'';const code=codeEl.textContent||'';if(lang==='svg'){const f=mk('div','svgf');const img=new Image();img.alt='svg';img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(code);f.append(img);p.replaceWith(f);return;}if(lang==='html'||lang==='htm'){const wrap=mk('div','viz-frame');const bar2=mk('div','viz-bar');bar2.append(mk('span','','Визуализация'));bar2.append(btn('На весь экран',()=>openArt(code)));const ifr=document.createElement('iframe');ifr.setAttribute('sandbox','allow-scripts allow-same-origin');ifr.srcdoc=code.includes('<html')||code.includes('<!doctype')?code:('<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>'+code+'</body></html>');wrap.append(bar2,ifr);p.replaceWith(wrap);return;}const bar=mk('div','cb');bar.append(mk('span','',lang||'code'));bar.append(btn('Копировать',e=>{navigator.clipboard.writeText(code);e.target.textContent='Скопировано'}));p.prepend(bar);});}
function node(m,i){const last=i==cur.msgs.length-1,d=mk('div','m '+(m.r=='user'?'u':'a'));if(m.r=='user'){(m.a||[]).forEach(a=>d.append(mk('div','cf',ico(a)+(a.n||a.k))));if(m.t)d.append(mk('div','bub',m.t));}else{const b=mk('div','md');if(m.t){b.innerHTML=md(m.t);enh(b);}else{const th=mk('div','thinking');th.append(mk('span','txt',stat||'Думаю'));const dots=mk('span','dots');dots.append(mk('i'),mk('i'),mk('i'));th.append(dots);b.append(th);}d.append(b);if(m.t&&!(run&&last)){const r=mk('div','acts');r.append(btn('Копировать',e=>{navigator.clipboard.writeText(m.t);e.target.textContent='Скопировано'}));d.append(r);}}return d;}
function openArt(code){$('#art iframe').srcdoc=code;$('#art').showModal()}$('#aX').onclick=()=>{$('#art').close();$('#art iframe').srcdoc='';};
function render(){const pj=tab=='projects',cn=tab=='connectors',lb=tab=='library';$('#comp').hidden=pj||cn||lb;$('#nP').classList.toggle('on',pj);const nC=$('#nC');if(nC)nC.classList.toggle('on',cn);const nL=$('#nL');if(nL)nL.classList.toggle('on',lb);if(pj)renderProj();else if(cn)renderConnectors();else if(lb)renderLibrary();else renderChat();}
function renderChat(){const box=$('#inner');box.textContent='';if(!cur||!cur.msgs.length){const h=mk('div','hello','Чем могу помочь?');let hint=S.key?('Модель: '+S.model):'Добавьте API-ключ: нажмите на название модели сверху';if(location.protocol==='file:'&&!isNative)hint+='\n\nОткройте через HTTP или Android-приложение.';h.append(mk('small','',hint));box.append(h);}else cur.msgs.forEach((m,i)=>box.append(node(m,i)));$('#ttl').textContent=cur?cur.title:'';$('#mod').textContent=S.model||'Настройки';const s=$('#msgs');s.scrollTop=s.scrollHeight;}
function renderProj(){const box=$('#inner');box.textContent='';$('#ttl').textContent='Проекты';$('#mod').textContent=S.model||'Настройки';box.append(mk('h2','pt','Проекты'));if(!PR.length)box.append(mk('p','muted','Проектов пока нет.'));PR.forEach(p=>{const c=mk('div','card gl');c.append(mk('b','',p.name));c.onclick=()=>{pv=p.id;render()};box.append(c);});}
function renderConnectors(){const box=$('#inner');box.textContent='';$('#ttl').textContent='Коннекторы';$('#mod').textContent=S.model||'Настройки';box.append(mk('p','muted','Подключите сервисы для MCP.'));const gh=CX.github||{};const connected=!!(gh.token&&gh.user);const card=mk('div','conn-card');const top=mk('div','conn-top');const body=mk('div','conn-body');body.append(mk('div','conn-name','GitHub'));const st=mk('div','conn-status'+(connected?' on':''));st.textContent=connected?('Подключен как @'+gh.user):'Нужна авторизация';body.append(st);top.append(body);const actions=mk('div','conn-actions');if(connected){actions.append(btn('Отключить',()=>{CX.github={enabled:true,token:'',user:null};saveCX();renderConnectors();}));}else{actions.append(pill('Подключить',()=>{$('#ghToken').value='';$('#ghAuthErr').style.display='none';$('#ghAuth').showModal();},1));}card.append(top,actions);box.append(card);const add=pill('+ Добавить MCP',()=>{$('#mcpName').value='';$('#mcpUrl').value='';$('#mcpToken').value='';$('#mcpAuth').showModal();},1);box.append(add);}
function renderLibrary(){const box=$('#inner');box.textContent='';$('#ttl').textContent='Библиотека';$('#mod').textContent=S.model||'Настройки';box.append(mk('h2','pt','Библиотека'));const files=[];(PR||[]).forEach(p=>{(p.files||[]).forEach(f=>files.push({f,p}));});if(!files.length)box.append(mk('p','muted','Файлов пока нет.'));files.forEach(({f,p})=>{const card=mk('div','card gl');card.append(mk('b','',ico(f)+' '+(f.n||'файл')));card.append(mk('small','',p?('Проект: '+p.name):''));box.append(card);});}
async function connectGitHub(){const token=($('#ghToken').value||'').trim();const err=$('#ghAuthErr');err.style.display='none';if(!token){err.textContent='Вставьте token';err.style.display='block';return;}try{let user;if(isNative){const res=await nativeHttpPost('https://api.github.com/user',{'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','User-Agent':'Connector-App'},'{}');/* wrong method - use get */}const r=isNative?await (async()=>{const id=nativeId();return new Promise((resolve,reject)=>{window.__nativePending[id]={resolve,reject};if(AndroidBridge.httpGetHeaders)AndroidBridge.httpGetHeaders(id,'https://api.github.com/user',JSON.stringify({'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','User-Agent':'Connector-App'}));else AndroidBridge.httpGet(id,'https://api.github.com/user');});})():null;if(isNative){if(!r.ok)throw new Error('HTTP '+r.status);user=JSON.parse(r.body);}else{const resp=await fetch('https://api.github.com/user',{headers:{'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','User-Agent':'Connector-App'}});if(!resp.ok)throw new Error('HTTP '+resp.status);user=await resp.json();}CX.github={enabled:true,token,user:user.login||user.name||'user'};saveCX();$('#ghAuth').close();renderConnectors();}catch(e){err.textContent=e.message||'Ошибка';err.style.display='block';}}
function saveMcpConnector(){const name=($('#mcpName').value||'').trim();const url=($('#mcpUrl').value||'').trim();const token=($('#mcpToken').value||'').trim();const err=$('#mcpAuthErr');err.style.display='none';if(!name||!url){err.textContent='Заполните поля';err.style.display='block';return;}CX.custom.push({id:'mcp_'+Date.now().toString(36),name,url,token,enabled:true});saveCX();$('#mcpAuth').close();renderConnectors();}
function list(){const l=$('#list');l.textContent='';chats.filter(c=>!qs||(c.title||'').toLowerCase().includes(qs)).forEach(c=>{const r=mk('div','ci'+(cur&&cur.id===c.id?' on':''));r.append(mk('span','',c.title||'Чат'));r.onclick=()=>{cur=c;tab='chat';list();render();closeSide();};l.append(r);});}
$('#sb').onclick=()=>{const q=$('#q');q.hidden=!q.hidden;if(q.hidden){q.value='';qs='';list()}else q.focus()};
$('#q').oninput=e=>{qs=e.target.value.trim().toLowerCase();list()};
busy(0);list();render();
</script>
